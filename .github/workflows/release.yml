name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version without a leading v
        required: true
        default: "0.2.6"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out source and Git LFS models
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if (-not $env:GITHUB_REF_NAME.StartsWith("v")) {
              throw "Release tags must start with v"
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "${{ inputs.version }}"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and validate release candidate
        shell: pwsh
        run: ./scripts/build_release.ps1 -Version $env:RELEASE_VERSION

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version $env:RELEASE_VERSION -BuildNuitka -SkipSync -SkipChecks

      - name: Prepare checksum filenames
        shell: pwsh
        run: |
          Copy-Item dist/SHA256SUMS.txt dist/SHA256SUMS-wheel.txt
          Copy-Item dist-installer/SHA256SUMS.txt dist-installer/SHA256SUMS-installer.txt

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: cua-pywin-${{ env.RELEASE_VERSION }}-windows
          path: |
            dist/SHA256SUMS-wheel.txt
            dist-installer/SHA256SUMS-installer.txt
          compression-level: 9
          retention-days: 1
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl -File -ErrorAction Stop).FullName
          $installer = (Get-ChildItem dist-installer -Filter "*-setup.exe" -File -ErrorAction Stop).FullName
          gh release create $env:GITHUB_REF_NAME `
            $wheel `
            $installer `
            (Resolve-Path dist/SHA256SUMS-wheel.txt).Path `
            (Resolve-Path dist-installer/SHA256SUMS-installer.txt).Path `
            --verify-tag `
            --generate-notes `
            --title "cua-pywin $env:RELEASE_VERSION"
