[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "cua-pywin"
version = "0.1.3"

description = "Windows UI automation MCP server for AI agents — screenshots, clicks, typing, UIA tree walking, vision (SOM), recording/replay, and learning"
authors = [
    { name = "zhangweiooy" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pynput>=1.8.1",
    "pillow>=10.2.0",
    "aiohttp>=3.9.1",
    "pyperclip>=1.9.0",
    "websockets>=12.0",
    "pywinctl>=0.4.1",
    "playwright>=1.40.0",
    "fastmcp>=2.0,<4",
    "starlette>=0.50.0,<1",
    # Windows runtime deps
    "pywin32>=310",
    "python-certifi-win32",
    "comtypes>=1.4.0",
    "mss>=9.0",
    "psutil>=5.9",
    "uiautomation>=2.0",
    "screeninfo>=0.8.1",
    # SOM vision / OCR
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "rapidocr>=3.8.1,<4",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.11",
    "ultralytics>=8.1",
    "supervision>=0.25",
    "transformers>=4.46.1,<4.47",
    "einops>=0.8",
    "timm>=1.0",
    # Windows.Graphics.Capture target-window capture backend
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-graphics>=3.2.1",
    "winrt-windows-graphics-capture>=3.2.1",
    "winrt-windows-graphics-capture-interop>=3.2.1",
    "winrt-windows-graphics-directx>=3.2.1",
    "winrt-windows-graphics-directx-direct3d11>=3.2.1",
    "winrt-windows-graphics-directx-direct3d11-interop>=3.2.1",
]

[project.optional-dependencies]
windows = [
    "pywin32>=310",
]
cdp = [
    "websockets>=12.0",
]
ocr-easy = [
    "easyocr>=1.7",
]

[project.urls]
homepage = "https://github.com/zhangweiooy/cua-pywin"
repository = "https://github.com/zhangweiooy/cua-pywin"

[project.scripts]
cua-win = "computer_server.tool_cli:main"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["computer_server", "som"]
excludes = ["som/.pdm-build", "som/tests"]

[tool.pdm.build.package-data]
computer_server = [
    "py.typed",
    "models/omniparser_v2/icon_caption/*",
    "models/rapidocr_ppocrv4/*",
]
som = ["weights/icon_detect/model.pt", "weights/icon_detect/model_manifest.json"]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
format = [
    "black>=23.0.0",
    "isort>=5.12.0",
]
dev = [
    "ruff>=0.0.241",
    "mypy>=0.971",
]
build = [
    "nuitka>=2.7",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]

[tool.pdm.scripts]
api = "cua-win serve"

[tool.ruff]
extend-exclude = ["computer_server/models/omniparser_v2/icon_caption"]

[tool.pytest.ini_options]
testpaths = ["tests", "som/tests"]
norecursedirs = [".git", ".venv", ".claude", "build", "dist", "dist-nuitka"]

[tool.ruff.lint.per-file-ignores]
"computer_server/handlers/windows.py" = ["E402"]
"computer_server/mcp_server.py" = ["E402"]
